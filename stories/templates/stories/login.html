{% extends "stories/base.html" %}
{% block title %}Log in · StoryTell{% endblock %}
{% block content %}
<section class="panel">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-row"><label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}{{ form.username.errors }}</div>
    <div class="form-row"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}{{ form.password.errors }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="help">New here? <a href="{% url 'stories:register' %}">Create an account</a>.</p>
</section>
{% endblock %}
